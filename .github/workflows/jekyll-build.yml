name: Site checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check site structure
        shell: pwsh
        run: ./tests/site-structure.ps1
      - name: Check navigation behavior
        run: node --test tests/site-shell.test.js
