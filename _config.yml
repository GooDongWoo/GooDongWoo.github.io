# Setup
title: GooDongWoo
description: 개발자 GooDongWoo의 포트폴리오 & 기술 블로그
url: https://GooDongWoo.github.io
avatar: /avatar.jpeg
paginate: 5
permalink: pretty

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec

# SEO
image: /avatar.jpeg
logo: /avatar.jpeg
twitter:
  username: GooDongWoo
  card: summary_large_image
social:
  name: GooDongWoo
  links:
    - https://github.com/GooDongWoo
lang: ko

# Search Engine Verification
# 구글 서치콘솔 및 네이버 서치어드바이저 등록 시 아래 주석 해제 후 인증값 입력
# google_site_verification: ""
# naver_site_verification: ""

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: GooDongWoo
  url: https://github.com/GooDongWoo/
  email: wendy1301@naver.com

# Defaults for SEO & Layout
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "GooDongWoo"
      image: "/avatar.jpeg"

